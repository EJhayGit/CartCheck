<svg xmlns="http://www.w3.org/2000/svg" width="380" height="590" viewBox="0 0 380 590" role="img" aria-labelledby="title desc">
  <title id="title">CartCheck product price history wireframe</title>
  <desc id="desc">A low fidelity product detail screen showing the last-paid price, dated price history, and Add to cart action.</desc>
  <style>
    .bg{fill:#eceeea}.screen{fill:#fff;stroke:#87918b;stroke-width:2}.box{fill:#f3f4f1;stroke:#b7beb8}.nav{fill:#f1f3ef;stroke:#cbd0cb}.line{stroke:#cbd0cb}.muted{fill:#dce1db}.text{fill:#2d342e;font:15px Arial,sans-serif}.small{fill:#4c574e;font:12px Arial,sans-serif}.tiny{fill:#4c574e;font:11px Arial,sans-serif}.head{fill:#1c261e;font:bold 19px Arial,sans-serif}.label{fill:#27312a;font:bold 17px Arial,sans-serif}.button{fill:#445b49}.buttontext{fill:#fff;font:bold 13px Arial,sans-serif}
  </style>
  <rect class="bg" width="380" height="590"/>
  <text class="label" x="20" y="28">8 · Product price history</text>
  <rect class="screen" x="20" y="44" width="340" height="520" rx="18"/>
  <text class="small" x="40" y="75">← Catalog</text>
  <rect class="muted" x="40" y="97" width="62" height="62" rx="6"/>
  <text class="head" x="116" y="124">Rice</text><text class="tiny" x="116" y="145">Pantry · priced per kg</text>
  <rect class="box" x="40" y="179" width="300" height="64" rx="6"/>
  <text class="small" x="54" y="203">Last paid</text><text class="head" x="54" y="229">₱65/kg</text>
  <text class="small" x="40" y="275">Price history</text><text class="tiny" x="253" y="275">Latest first</text>
  <line class="line" x1="40" y1="288" x2="340" y2="288"/>
  <text class="text" x="40" y="313">Sep 23 trip</text><text class="small" x="291" y="313">₱65/kg</text>
  <text class="tiny" x="40" y="332">2 kg bought · total ₱130</text>
  <line class="line" x1="40" y1="346" x2="340" y2="346"/>
  <text class="text" x="40" y="370">Sep 11 trip</text><text class="small" x="291" y="370">₱62/kg</text>
  <text class="tiny" x="40" y="389">1.5 kg bought · total ₱93</text>
  <line class="line" x1="40" y1="404" x2="340" y2="404"/>
  <text class="tiny" x="40" y="430">Past trip edits update this history.</text>
  <rect class="button" x="40" y="451" width="300" height="43" rx="6"/>
  <text class="buttontext" x="151" y="478">Add to cart</text>
  <rect class="nav" x="20" y="494" width="340" height="70"/>
  <text class="small" x="44" y="528">Cart</text><text class="small" x="119" y="528">Catalog</text><text class="small" x="222" y="528">Trips</text><text class="small" x="289" y="528">Settings</text>
</svg>
